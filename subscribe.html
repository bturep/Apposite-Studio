<!doctype html>
<html lang="en">
<head>

<!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4Z03LNW37H');

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Subscribe — Studio Apposite</title>
<meta name="description" content="Subscribe to Studio Apposite updates on publications, exhibitions, and architectural research." />

<link rel="icon" href="/favicon.ico" type="image/x-icon">

<!-- Lato -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

body{
  font-family:"Lato", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  font-size:16px;
  line-height:1.55;
  color:#000;
  background:#fff;
}

:root{
  --rhythm:16px;
  --label-col:240px;
  --gap:28px;
  --edge:24px;
  --content-max:620px;
}

.wrap{
  max-width:980px;
  padding:var(--edge) var(--edge) calc(var(--rhythm)*6);
}

.row{
  display:grid;
  grid-template-columns:var(--label-col) minmax(0,var(--content-max));
  column-gap:var(--gap);
  padding:calc(var(--rhythm)*0.5) 0;
  align-items:baseline;
}

.label{
  font-weight:700;
  text-align:right;
}

p{ margin:0 0 var(--rhythm) 0; }

.b{ font-weight:700; }

a{
  color:#000;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}

@media (hover:hover){
  a:hover{ text-decoration-thickness:2px; }
}

/* Rule */
.rule{
  height:1px;
  width:100%;
  background-image:repeating-linear-gradient(
    to right,
    #000 0,
    #000 2px,
    transparent 2px,
    transparent 7px
  );
}

.rulewrap{ margin:calc(var(--rhythm)*0.75) 0; }

/* Newsletter form */
.newsletter-inline{
  display:flex;
  align-items:baseline;
  gap:18px;
  flex-wrap:wrap;
}

.emailfield{
  position:relative;
  border:1px dotted #000;
  width:min(520px,100%);
  height:34px;
}

.emailfield span{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
}

.emailfield input{
  position:absolute;
  inset:0;
  border:0;
  background:transparent;
  padding:6px 10px;
  padding-left:62px;
  font:inherit;
  outline:none;
}

.newsletter-submit{
  border:0;
  padding:0;
  background:none;
  font:inherit;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}

@media (max-width:760px){
  .row{ grid-template-columns:1fr; }
  .label{ text-align:left; margin-bottom:6px; }
}

.colophon{
  font-size:13px;
  line-height:1.4;
}
</style>
</head>

<body>

<main class="wrap">

<section class="row">
  <div class="label">STUDIO APPOSITE</div>
  <div class="content">
    <h1 class="b">Subscribe</h1>

    <p>
      Periodic updates on publications, exhibitions, and research projects from Studio Apposite and Apposite Press.
    </p>

    <form
      action="https://buttondown.com/api/emails/embed-subscribe/studioapposite"
      method="post"
    >
      <input type="hidden" name="tag" value="research" />
      <input type="hidden" name="metadata[source]" value="subscribe-page" />

      <!-- honeypot -->
      <input type="text" name="bd_hp" tabindex="-1" autocomplete="off"
             style="position:absolute;left:-5000px;" aria-hidden="true">

      <div class="newsletter-inline">
        <label class="emailfield">
          <span>Email</span>
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            inputmode="email"
            aria-label="Email address"
          />
        </label>

        <button type="submit" class="newsletter-submit">Subscribe</button>
      </div>
    </form>

    <p style="margin-top:calc(var(--rhythm)*1);">
      <a href="index.html">← Back to Studio Apposite</a>
    </p>
  </div>
</section>

<section class="row rulewrap" aria-hidden="true">
  <div class="label"></div>
  <div class="content"><div class="rule"></div></div>
</section>

<section class="row">
  <div class="label"></div>
  <div class="content">
    <p class="colophon">© <span id="y"></span> Studio Apposite · Victoria, BC</p>
  </div>
</section>

</main>

<script>
document.getElementById("y").textContent = new Date().getFullYear();
</script>

</body>
</html>
