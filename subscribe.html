<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Subscribe — Studio Apposite</title>
  <meta name="description" content="Subscribe to Studio Apposite — Research Updates." />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body{
      font-family: "Lato", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: #000;
      background: #fff;
    }

    :root{
      --rhythm: 16px;
      --label-col: 240px;
      --gap: 28px;
      --edge: 24px;
      --content-max: 620px;
    }

    .wrap{
      max-width: 980px;
      padding: var(--edge);
      padding-bottom: calc(var(--rhythm) * 6);
    }

    .row{
      display: grid;
      grid-template-columns: var(--label-col) minmax(0, var(--content-max));
      column-gap: var(--gap);
      padding: calc(var(--rhythm) * 0.75) 0;
      align-items: baseline;
    }

    .label{
      font-weight: 700;
      text-align: right;
    }

    h1{
      margin: 0 0 calc(var(--rhythm) * 0.75);
      font-size: inherit;
      font-weight: 700;
    }

    p{ margin: 0 0 var(--rhythm); }

    /* Form */
    form{ margin-top: calc(var(--rhythm) * 0.5); }

    input{
      font: inherit;
      width: min(520px, 100%);
      padding: 8px 10px;
      border: 1px solid #000;
      background: #fff;
    }

    button{
      margin-top: calc(var(--rhythm) * 0.75);
      font: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a{
      color: #000;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 760px){
      .row{ grid-template-columns: 1fr; }
      .label{ text-align: left; margin-bottom: 6px; }
    }
  </style>
</head>

<body>

<main class="wrap">

  <section class="row">
    <div class="label">Newsletter</div>
    <div class="content">
      <h1>Studio Apposite — Research Updates</h1>

      <p>
        Occasional updates on publications in development, archival research,
        exhibitions, and notes on regional architectural history.
      </p>

      <!-- CONVERTKIT FORM -->
      <form
        action="https://app.convertkit.com/forms/FORM_ID/subscriptions"
        method="post"
      >
        <!-- REQUIRED -->
        <input type="hidden" name="form_id" value="FORM_ID">

        <!-- OPTIONAL: tagging -->
        <input type="hidden" name="tags[]" value="research">

        <!-- OPTIONAL: redirect -->
        <input type="hidden" name="redirect" value="https://apposite.studio/subscribed.html">

        <!-- Honeypot -->
        <input type="text" name="hp" tabindex="-1" autocomplete="off"
               style="position:absolute;left:-5000px;" aria-hidden="true">

        <label>
          <span class="sr-only">Email address</span>
          <input
            type="email"
            name="email_address"
            placeholder="Email"
            required
            autocomplete="email"
          />
        </label>

        <button type="submit">Subscribe</button>
      </form>

      <p class="small">
        <a href="/">← Back to Studio Apposite</a>
      </p>
    </div>
  </section>

</main>

</body>
</html>
